spring.application.name=jumpking
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.config.import=optional:file:./config/
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
app.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:8080
app.session-absolute-timeout=24h
app.auth-rate-per-minute=20
app.http-body-limit=16384
app.rate-bucket-limit=10000
app.fly-enabled=${FLY_ENABLED:false}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
